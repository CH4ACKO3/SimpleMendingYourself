name: Update Workshop titles and compatibility links
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  update-description:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 5
    environment: steam-workshop
    concurrency:
      group: smy-steam-account
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Build description updater
        shell: pwsh
        run: |
          dotnet publish Tools/WorkshopOwnerCheck/WorkshopOwnerCheck.csproj -c Release -warnaserror -o artifacts/description-publisher
          if ($LASTEXITCODE) { throw 'Description updater build failed.' }
      - name: Update and verify localized titles and compatibility links
        shell: pwsh
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_REFRESH_TOKEN: ${{ secrets.STEAM_REFRESH_TOKEN }}
        run: |
          dotnet artifacts/description-publisher/WorkshopOwnerCheck.dll update-compatibility-links Docs/workshop
          if ($LASTEXITCODE) { throw 'Workshop description update failed.' }
